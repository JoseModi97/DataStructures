<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Greedy Algorithm Demo</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 20px;}
        input[type=number] {width: 60px;}
        button {margin-left: 10px;}
        #results {margin-top: 20px;}
    </style>
</head>
<body>
    <h1>Greedy Algorithm: Coin Change</h1>
    <p>
        Enter an amount and click "Make Change" to see how the greedy algorithm chooses coins.
    </p>
    <label for="amount">Amount (cents):</label>
    <input id="amount" type="number" min="0" value="0">
    <button id="changeBtn">Make Change</button>
    <div id="results"></div>

    <script src="greedy.js"></script>
</body>
</html>
